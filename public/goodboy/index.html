<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>good boy</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231c1526'/%3E%3Ctext x='32' y='45' font-family='Arial,Helvetica,sans-serif' font-size='38' font-weight='700' fill='%23ff2e88' text-anchor='middle'%3Ee%3C/text%3E%3C/svg%3E" />
    <meta name="description" content="A very small page about a very good boy." />
    <meta name="theme-color" content="#14100d" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #14100d;
        --line: #392c22;
        --text: #f4ece0;
        --dim: #ab9c8a;
        --faint: #6b5d4e;
        --cobalt: #8ba0ff;
        --font: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        background-image:
          radial-gradient(60% 45% at 50% 0%, rgba(139, 160, 255, 0.1), transparent 70%),
          radial-gradient(circle, rgba(244, 236, 224, 0.05) 1px, transparent 1.4px);
        background-size:
          auto,
          22px 22px;
        color: var(--text);
        font-family: var(--font);
        display: flex;
        flex-direction: column;
      }
      header {
        border-bottom: 1px solid var(--line);
      }
      header .wrap {
        max-width: 880px;
        margin: 0 auto;
        padding: 1.4rem clamp(1.25rem, 4vw, 2rem);
      }
      .logo {
        font-weight: 800;
        font-size: 1rem;
        text-decoration: none;
      }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
      }
      .card {
        text-align: center;
      }
      .paw {
        width: 48px;
        height: 34px;
        margin: 0 auto 1.2rem;
        position: relative;
      }
      .paw i {
        position: absolute;
        border-radius: 50%;
        background: var(--cobalt);
      }
      .paw i:nth-child(1) {
        width: 15px;
        height: 15px;
        top: 0;
        left: 4px;
      }
      .paw i:nth-child(2) {
        width: 15px;
        height: 15px;
        top: 0;
        right: 4px;
      }
      .paw i:nth-child(3) {
        width: 24px;
        height: 20px;
        bottom: 0;
        left: 12px;
        border-radius: 50% 50% 45% 45%;
      }
      p.label {
        margin: 0;
        font-size: 1.3rem;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap">
        <span class="logo">eaton</span>
      </div>
    </header>

    <main>
      <div class="card">
        <div class="paw"><i></i><i></i><i></i></div>
        <p class="label">good boy</p>
      </div>
    </main>
  </body>
</html>
