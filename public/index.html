<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ari eaton</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231c1526'/%3E%3Ctext x='32' y='45' font-family='Arial,Helvetica,sans-serif' font-size='38' font-weight='700' fill='%23ff2e88' text-anchor='middle'%3Ee%3C/text%3E%3C/svg%3E" />
    <meta name="description" content="Ari Eaton's projects — battleship, good boy, poker against a bot, and whatever's next." />
    <meta name="theme-color" content="#f7f1e4" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://arieaton.com/" />
    <meta property="og:title" content="ari eaton" />
    <meta property="og:description" content="Ari Eaton's projects — battleship, good boy, poker against a bot, and whatever's next." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ari eaton" />
    <meta name="twitter:description" content="Ari Eaton's projects — battleship, good boy, poker against a bot, and whatever's next." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #f7f1e4;
        --surface: #ffffff;
        --surface-hover: #fff9ec;
        --line: #e8dcc2;
        --ink: #1c1526;
        --dim: #665b74;
        --faint: #9a8fa4;
        --pink: #ff2e88;
        --orange: #ff7a1a;
        --cyan: #00aec9;
        --violet: #8b5cf6;
        --font: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
        --nav-h: 60px;
      }

      * {
        box-sizing: border-box;
      }
      html {
        color-scheme: light;
      }

      body {
        margin: 0;
        background: var(--bg);
        background-image:
          radial-gradient(60% 45% at 50% 0%, rgba(255, 46, 136, 0.1), transparent 70%),
          radial-gradient(circle, rgba(28, 21, 38, 0.07) 1px, transparent 1.4px);
        background-size:
          auto,
          22px 22px;
        color: var(--ink);
        font-family: var(--font);
      }

      a {
        color: inherit;
      }

      .wrap {
        width: 100%;
        padding: 0 clamp(1.25rem, 5vw, 5rem);
      }

      /* ---------- nav ---------- */
      .site-nav {
        position: sticky;
        top: 0;
        z-index: 20;
        height: var(--nav-h);
        display: flex;
        align-items: center;
        background: rgba(247, 241, 228, 0.5);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--line);
        box-shadow: none;
        transition: background-color 0.25s ease, box-shadow 0.25s ease;
      }
      .site-nav.is-condensed {
        background: rgba(247, 241, 228, 0.92);
        box-shadow: 0 10px 26px rgba(28, 21, 38, 0.1);
      }
      .site-nav .wrap {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }
      .logo {
        font-weight: 800;
        font-size: 1rem;
        text-decoration: none;
      }
      .site-nav nav {
        display: flex;
        gap: 1.5rem;
        font-size: 0.8rem;
      }
      .site-nav nav a {
        text-decoration: none;
        color: var(--faint);
        border-bottom: 1px solid transparent;
        padding-bottom: 2px;
        transition: color 0.15s ease;
      }
      .site-nav nav a.is-active,
      .site-nav nav a:hover {
        color: var(--pink);
        border-bottom-color: var(--pink);
      }
      a:focus-visible {
        outline: 2px solid var(--pink);
        outline-offset: 3px;
      }

      section {
        scroll-margin-top: var(--nav-h);
      }

      /* ---------- hero ---------- */
      .hero {
        min-height: calc(100vh - var(--nav-h));
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 3rem 0;
      }
      .hero-inner {
        will-change: transform, opacity;
      }
      .hero .kicker {
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--faint);
        margin: 0 0 1.1rem;
      }
      .hero h1 {
        margin: 0;
        font-size: clamp(2rem, 6.4vw, 3.6rem);
        line-height: 1.18;
        font-weight: 800;
        letter-spacing: -0.01em;
        text-wrap: balance;
      }
      .hero h1 .w-pink {
        color: var(--pink);
      }
      .hero h1 .w-orange {
        color: var(--orange);
      }
      .hero h1 .w-cyan {
        color: var(--cyan);
      }
      .hero h1 .w-violet {
        color: var(--violet);
      }
      .scroll-cue {
        margin-top: 3rem;
        font-size: 0.76rem;
        color: var(--faint);
        display: inline-flex;
        align-items: center;
        gap: 0.5em;
        width: fit-content;
      }
      .scroll-cue .arrow {
        animation: bob 1.6s ease-in-out infinite;
      }
      @keyframes bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(4px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .scroll-cue .arrow {
          animation: none;
        }
      }

      /* ---------- reveal-on-scroll ----------
         Driven entirely by the scroll handler in the page script: opacity/transform are
         set directly per animation frame from actual scroll position, so it scrubs
         both ways (scroll up = un-reveals) instead of firing once and staying put.
         No CSS transition here on purpose -- a lagging transition fighting a
         per-frame update reads as laggy, not smooth. */
      .reveal {
        opacity: 0;
        transform: translateY(22px);
      }
      @media (prefers-reduced-motion: reduce) {
        .reveal {
          opacity: 1;
          transform: none;
        }
      }

      /* ---------- section label ---------- */
      .section-label {
        font-size: 0.7rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--faint);
        margin: 0 0 1.3rem;
      }

      /* ---------- about ---------- */
      .about {
        min-height: calc(100vh - var(--nav-h));
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 4rem 0;
        border-top: 1px solid var(--line);
      }
      .about p {
        margin: 0;
        font-size: clamp(1.3rem, 3.2vw, 1.8rem);
        font-weight: 700;
        line-height: 1.4;
        max-width: 20ch;
      }

      /* ---------- projects ---------- */
      .projects {
        min-height: calc(100vh - var(--nav-h));
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 4rem 0;
        border-top: 1px solid var(--line);
      }
      .projects-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 1.1rem;
      }
      .proj-tile {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 1.1rem;
        padding: 1.7rem 1.4rem;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
        text-decoration: none;
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      }
      .proj-tile:hover {
        transform: translateY(-4px);
        border-color: var(--tile-c, var(--line));
        box-shadow: 0 16px 32px -14px color-mix(in srgb, var(--tile-c, var(--ink)) 45%, transparent);
      }
      .proj-tile .head {
        display: flex;
        align-items: center;
        gap: 0.6em;
        flex-wrap: wrap;
      }
      .proj-tile h2 {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 800;
      }
      .tag {
        font-size: 0.62rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 0.15rem 0.55rem;
        border-radius: 999px;
        color: var(--tag-c, var(--faint));
        background: color-mix(in srgb, var(--tag-c, var(--faint)) 14%, white);
        border: 1px solid color-mix(in srgb, var(--tag-c, var(--faint)) 40%, transparent);
      }

      /* icons */
      .icon {
        width: 44px;
        height: 44px;
        flex: 0 0 auto;
        position: relative;
      }
      .icon-radar {
        border-radius: 50%;
        border: 1px solid var(--pink);
        background: conic-gradient(from 0deg, rgba(255, 46, 136, 0.55), transparent 40%);
        animation: spin 3s linear infinite;
      }
      .icon-paw i {
        position: absolute;
        border-radius: 50%;
        background: var(--cyan);
      }
      .icon-paw i:nth-child(1) {
        width: 13px;
        height: 13px;
        top: 2px;
        left: 4px;
      }
      .icon-paw i:nth-child(2) {
        width: 13px;
        height: 13px;
        top: 0;
        right: 2px;
      }
      .icon-paw i:nth-child(3) {
        width: 20px;
        height: 18px;
        bottom: 2px;
        left: 9px;
        border-radius: 50% 50% 45% 45%;
      }
      .icon-node i {
        position: absolute;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--violet);
        box-shadow: 0 0 8px var(--violet);
        animation: nodepulse 1.8s ease-in-out infinite;
      }
      .icon-node i:nth-child(1) {
        top: 2px;
        left: 15px;
        animation-delay: 0s;
      }
      .icon-node i:nth-child(2) {
        bottom: 4px;
        left: 0;
        animation-delay: 0.3s;
      }
      .icon-node i:nth-child(3) {
        bottom: 4px;
        right: 0;
        animation-delay: 0.6s;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes nodepulse {
        0%,
        100% {
          opacity: 0.45;
          transform: scale(0.85);
        }
        50% {
          opacity: 1;
          transform: scale(1.15);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .icon-radar,
        .icon-node i {
          animation: none;
        }
      }

      /* ---------- footer ---------- */
      footer {
        border-top: 1px solid var(--line);
      }
      footer .wrap {
        padding: 1.3rem clamp(1.25rem, 4vw, 2rem);
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
        font-size: 0.75rem;
        color: var(--faint);
      }
      footer a {
        color: var(--faint);
        text-decoration: none;
      }
      footer a:hover {
        color: var(--pink);
      }
    </style>
  </head>

  <body>
    <header class="site-nav">
      <div class="wrap">
        <a class="logo" href="#home">eaton</a>
        <nav aria-label="Section">
          <a href="#home" data-target="home">home</a>
          <a href="#about" data-target="about">about</a>
          <a href="#projects" data-target="projects">projects</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero" id="home">
        <div class="wrap">
          <div class="hero-inner">
            <p class="kicker reveal">ari eaton</p>
            <h1 class="reveal">
              <span class="w-pink">builds</span> <span class="w-orange">small,</span>
              <span class="w-cyan">slightly</span> <span class="w-violet">overengineered</span>
              things for the web.
            </h1>
            <a class="scroll-cue reveal" href="#about"><span class="arrow">↓</span> keep scrolling</a>
          </div>
        </div>
      </section>

      <section class="about" id="about">
        <div class="wrap">
          <p class="section-label reveal">about</p>
          <p class="reveal">builds small, slightly overengineered things for the web.</p>
        </div>
      </section>

      <section class="projects" id="projects">
        <div class="wrap">
          <p class="section-label reveal">projects</p>

          <div class="projects-grid">
            <a class="proj-tile reveal" href="/battleship" style="--tile-c: var(--pink)">
              <div class="icon icon-radar"></div>
              <div class="head">
                <h2>battleship</h2>
                <span class="tag" style="--tag-c: var(--pink)">live</span>
              </div>
            </a>

            <a class="proj-tile reveal" href="/goodboy" style="--tile-c: var(--cyan)">
              <div class="icon icon-paw"><i></i><i></i><i></i></div>
              <div class="head">
                <h2>good boy</h2>
                <span class="tag" style="--tag-c: var(--cyan)">live</span>
              </div>
            </a>

            <a class="proj-tile reveal" href="/poker" style="--tile-c: var(--violet)">
              <div class="icon icon-node"><i></i><i></i><i></i></div>
              <div class="head">
                <h2 style="color: var(--violet)">poker</h2>
                <span class="tag" style="--tag-c: var(--violet)">live</span>
              </div>
            </a>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div class="wrap">
        <span>ariEaton.com</span>
        <a href="#home">↑ back to top</a>
      </div>
    </footer>

    <script>
      (function () {
        var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var reveals = Array.prototype.slice.call(document.querySelectorAll(".reveal"));
        var heroInner = document.querySelector(".hero-inner");
        var heroSection = document.getElementById("home");
        var nav = document.querySelector(".site-nav");

        function clamp(v, lo, hi) {
          return Math.max(lo, Math.min(hi, v));
        }

        if (reduceMotion) {
          reveals.forEach(function (el) {
            el.style.opacity = "1";
            el.style.transform = "none";
          });
          if (nav) nav.classList.add("is-condensed");
        } else {
          var ticking = false;

          function update() {
            var vh = window.innerHeight;

            // hero recedes as you scroll past it, rather than just vanishing
            if (heroInner && heroSection) {
              var heroRect = heroSection.getBoundingClientRect();
              var p = clamp(-heroRect.top / (heroRect.height * 0.7 || 1), 0, 1);
              heroInner.style.opacity = String(1 - p * 0.85);
              heroInner.style.transform = "translateY(" + (p * -50).toFixed(1) + "px) scale(" + (1 - p * 0.08).toFixed(3) + ")";
            }

            // each .reveal scrubs in/out with actual scroll position
            reveals.forEach(function (el) {
              var rect = el.getBoundingClientRect();
              var start = vh * 0.92;
              var end = vh * 0.55;
              var prog = clamp((start - rect.top) / (start - end || 1), 0, 1);
              el.style.opacity = String(prog);
              el.style.transform = "translateY(" + ((1 - prog) * 22).toFixed(1) + "px)";
            });

            nav && nav.classList.toggle("is-condensed", window.scrollY > 30);
            ticking = false;
          }

          function onScroll() {
            if (!ticking) {
              requestAnimationFrame(update);
              ticking = true;
            }
          }

          window.addEventListener("scroll", onScroll, { passive: true });
          window.addEventListener("resize", onScroll);
          update();
        }

        var navLinks = document.querySelectorAll(".site-nav nav a");
        var sections = document.querySelectorAll("main section[id]");
        var spy = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                navLinks.forEach(function (a) {
                  a.classList.toggle("is-active", a.dataset.target === entry.target.id);
                });
              }
            });
          },
          { rootMargin: "-40% 0px -55% 0px" }
        );
        sections.forEach(function (s) {
          spy.observe(s);
        });
      })();
    </script>
  </body>
</html>
